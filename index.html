<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英会話は赤ちゃん以下 - 洋画リスニングへの道</title>

  <!-- 紙吹雪（コンフェティ）用ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #FFF9F2;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
      text-align: center;
      position: relative;
      box-sizing: border-box;
    }

    h1 {
      font-size: 22px;
      color: #5A4A42;
      margin: 6px 0;
    }

    .subtitle {
      color: #8C7A6B;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .btn-icon {
      background: #F0F4F8;
      border: none;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      color: #4A5568;
      cursor: pointer;
    }

    .home-status-box {
      background: #FFF5F5;
      border-radius: 16px;
      padding: 12px;
      margin: 12px 0;
      font-size: 13px;
      font-weight: bold;
      color: #C05621;
      display: flex;
      justify-content: space-around;
    }

    .char-area {
      background: #EBF7FF;
      border-radius: 16px;
      padding: 12px;
      margin: 12px 0;
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    .char-container {
      position: relative;
      font-size: 36px;
      min-width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .char-hat {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 22px;
      z-index: 2;
    }

    .char-msg {
      font-size: 13px;
      font-weight: bold;
      color: #2B6CB0;
      text-align: left;
    }

    .en-text {
      font-size: 25px;
      font-weight: bold;
      color: #2D3748;
      margin: 16px 0 4px;
      word-break: break-word;
    }

    .jp-text {
      font-size: 15px;
      color: #718096;
      margin-bottom: 20px;
    }

    .btn {
      width: 100%;
      padding: 13px;
      margin: 5px 0;
      border: none;
      border-radius: 30px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-sizing: border-box;
    }

    .btn-listen { background: #EBF7FF; color: #2B6CB0; }
    .btn-speak { background: #FFF0E5; color: #C05621; }
    .btn-next { background: #FF6B6B; color: white; margin-top: 10px; }
    .btn-start { background: #FF6B6B; color: white; }
    .btn-shop { background: #FEFCBF; color: #744210; margin-top: 6px; }

    .spoken-box {
      font-size: 13px;
      color: #4A5568;
      background: #EDF2F7;
      border-radius: 12px;
      padding: 10px;
      margin-top: 8px;
      min-height: 20px;
      word-break: break-word;
    }

    .result {
      margin-top: 6px;
      font-weight: bold;
      font-size: 14px;
      min-height: 22px;
    }

    .name-input {
      width: 90%;
      padding: 12px;
      border: 2px solid #E2E8F0;
      border-radius: 14px;
      font-size: 16px;
      text-align: center;
      margin: 8px 0 12px;
      outline: none;
      box-sizing: border-box;
    }

    .level-option {
      background: #F7FAFC;
      border: 2px solid #E2E8F0;
      border-radius: 16px;
      padding: 10px;
      margin: 6px 0;
      text-align: left;
      cursor: pointer;
    }

    .level-option.selected {
      border-color: #FF6B6B;
      background: #FFF5F5;
    }

    .modal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      border-radius: 24px;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 20px;
      width: 85%;
      max-height: 90%;
      overflow-y: auto;
      text-align: center;
      box-sizing: border-box;
    }

    .shop-item, .badge-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #F7FAFC;
      padding: 10px;
      border-radius: 12px;
      margin: 8px 0;
      font-size: 13px;
    }

    .shop-btn {
      background: #48BB78;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .mic-status {
      background: #EDF2F7;
      padding: 10px;
      border-radius: 12px;
      margin: 10px 0;
      font-size: 12px;
      color: #2D3748;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="card" id="app">

  <!-- 設定・記録モーダル -->
  <div class="modal" id="recordModal">
    <div class="modal-content">
      <div style="font-size:36px;">⚙️🐱</div>
      <h3 style="color:#5A4A42; margin:4px 0;">設定・記録</h3>
      
      <!-- マイクテスト領域 -->
      <div class="mic-status">
        🎤 音声認識：
        <span id="micSupportText">確認中...</span>

        <button
          class="btn btn-listen"
          style="margin-top:8px;"
          onclick="testMicrophone()">
          🎤 マイクをテスト
        </button>
      </div>

      <div style="background:#FFF0E5; padding:10px; border-radius:16px; margin:10px 0; font-weight:bold; color:#5A4A42; font-size:13px;">
        <p style="margin:4px 0;">🔥 連続記録: <span id="modalStreak">0</span>日</p>
        <p style="margin:4px 0;">🏆 累計学習: <span id="modalTotal">0</span>日</p>
        <p style="margin:4px 0;">🪙 所持コイン: <span id="modalCoins">0</span>枚</p>
      </div>

      <div style="margin:14px 0; text-align:left;">
        <span style="font-size:12px; font-weight:bold; color:#718096; margin-bottom:6px; display:block;">🏅 ご褒美バッジ</span>
        <div id="badgeList"></div>
      </div>

      <button class="btn btn-next" onclick="closeRecordModal()">とじる</button>
    </div>
  </div>

  <!-- 着せ替えショップモーダル -->
  <div class="modal" id="shopModal">
    <div class="modal-content">
      <div style="font-size:36px;">👑🐶</div>
      <h3 style="color:#5A4A42; margin:4px 0;">ぽてワンの服屋さん</h3>
      <p style="font-size:12px; color:#718096; margin-bottom:12px;">コイン: <span id="shopCoins">0</span> 🪙</p>
      <div id="shopList"></div>
      <button class="btn btn-next" onclick="closeShopModal()">完了</button>
    </div>
  </div>

  <!-- ホーム画面（初期設定・スタート） -->
  <div id="homeArea">
    <div style="font-size:40px;">🎬👶🐶</div>
    <h1>英会話は赤ちゃん以下</h1>
    <div class="subtitle">目指せ！洋画を字幕なしで聴き取る力</div>

    <div class="home-status-box">
      <span>🔥 <span id="homeStreak">0</span>日連続</span>
      <span>🏆 累計 <span id="homeTotal">0</span>日</span>
      <span>🪙 <span id="homeCoins">0</span> コイン</span>
    </div>

    <p style="font-weight:bold; color:#5A4A42; margin-bottom:4px; font-size:14px;">お名前</p>
    <input id="nameInput" class="name-input" type="text" placeholder="例: Taro" maxlength="30">

    <p style="font-weight:bold; color:#5A4A42; margin-bottom:6px; font-size:14px;">英語レベルを選択</p>
    <div class="level-option selected" id="initLevel_1" onclick="chooseInitLevel(1)">
      <div style="font-weight:bold; font-size:13px;">🍼 レベル1：超初心者</div>
    </div>
    <div class="level-option" id="initLevel_2" onclick="chooseInitLevel(2)">
      <div style="font-weight:bold; font-size:13px;">🐣 レベル2：日常会話</div>
    </div>
    <div class="level-option" id="initLevel_3" onclick="chooseInitLevel(3)">
      <div style="font-weight:bold; font-size:13px;">🎬 レベル3：洋画チャレンジ</div>
    </div>

    <button class="btn btn-start" onclick="saveNameAndStart()" style="margin-top:12px;">▶ レッスンスタート！</button>
    <button class="btn btn-shop" onclick="openShopModal()">👒 ぽてワンを着せ替える</button>
  </div>

  <!-- メイン学習画面 -->
  <div id="lessonArea" style="display:none;">
    <div class="header-bar">
      <button class="btn-icon" onclick="goHome()">🏠 ホーム</button>
      <span style="color:#A0AEC0; font-size:12px; font-weight:bold;" id="stepProgress">1/5</span>
      <button class="btn-icon" onclick="openRecordModal()">⚙️ 設定</button>
    </div>

    <div class="char-area">
      <div class="char-container">
        <div class="char-hat" id="charHat"></div>
        <div id="charIcon">🐶</div>
      </div>
      <div class="char-msg" id="charMsg">ぽてワン「音の響きをよく聴いてね！」</div>
    </div>

    <div class="en-text" id="enText">Thank you.</div>
    <div class="jp-text" id="jpText">ありがとう。</div>

    <button class="btn btn-listen" id="btnListen" onclick="speakCurrent()">🔊 きく</button>
    <button class="btn btn-speak" id="btnSpeak" onclick="startListen()">🎤 マネして言う</button>

    <div class="spoken-box" id="spokenBox">👂 声を聞かせてね</div>
    <div class="result" id="resultMsg"></div>
    <button class="btn btn-next" onclick="nextLesson()">つぎへ ✨</button>
  </div>

</div>

<script>
  let userName = "";
  let currentLevel = 1;
  let currentSubIndex = 0;
  let currentIndex = 0;
  let streak = 0;
  let total = 0;
  let coins = 0;
  let lastDate = "";
  let currentSpeed = 0.5;
  let equippedHat = "";
  let ownedHats = [];
  let unlockedBadges = [];

  const shopItems = [
    { id: "crown", name: "王冠", icon: "👑", price: 30 },
    { id: "party", name: "パーティー帽", icon: "🥳", price: 50 },
    { id: "grad", name: "博士帽", icon: "🎓", price: 80 },
    { id: "ribbon", name: "赤いリボン", icon: "🎀", price: 100 }
  ];

  const badgeDefinitions = [
    { id: "first_step", name: "はじめの一歩", desc: "1日目のレッスン完了", icon: "🌱" },
    { id: "streak_3", name: "3日連続達成", desc: "3日連続で学習", icon: "🔥" },
    { id: "coin_100", name: "コインコレクター", desc: "100コイン貯める", icon: "🪙" }
  ];

  const curriculumData = {
    1: { name: "レベル1", subStages: [{ id: "1-1", title: "基本", items: [{ en: "Thank you.", jp: "ありがとう。" }, { en: "Good morning.", jp: "おはよう。" }, { en: "See you.", jp: "またね。" }, { en: "Hello.", jp: "こんにちは。" }, { en: "Yes.", jp: "はい。" }] }] },
    2: { name: "レベル2", subStages: [{ id: "2-1", title: "会話", items: [{ en: "I'm on my way.", jp: "今向かってるよ。" }, { en: "Sounds good.", jp: "いいね！" }, { en: "No problem.", jp: "問題ないよ。" }, { en: "How are you?", jp: "元気？" }, { en: "Take care.", jp: "気をつけてね。" }] }] },
    3: { name: "レベル3", subStages: [{ id: "3-1", title: "洋画", items: [{ en: "Give me a break.", jp: "勘弁してよ。" }, { en: "It's up to you.", jp: "君に任せるよ。" }, { en: "Never give up.", jp: "諦めないで。" }, { en: "I got it.", jp: "分かったよ。" }, { en: "Believe in yourself.", jp: "自分を信じて。" }] }] }
  };

  window.onload = function() {
    loadData();
    checkStreak();
    updateHomeDisplay();
    checkMicSupport();
  };

  function checkMicSupport() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const textEl = document.getElementById("micSupportText");
    if (SpeechRecognition) {
      textEl.innerText = "対応（準備OK）";
      textEl.style.color = "#2E7D32";
    } else {
      textEl.innerText = "非対応（ブラウザ未対応）";
      textEl.style.color = "#E53E3E";
    }
  }

  function testMicrophone() {
    const textEl = document.getElementById("micSupportText");
    textEl.innerText = "マイク確認中...";
    textEl.style.color = "#2D3748";

    if (!window.isSecureContext) {
      textEl.innerText = "❌ 安全な接続ではありません(HTTPSが必要)";
      textEl.style.color = "#E53E3E";
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      textEl.innerText = "❌ ブラウザがマイクAPI非対応です";
      textEl.style.color = "#E53E3E";
      return;
    }

    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function(stream) {
        textEl.innerText = "✅ マイクOK！正常に取得できました！";
        textEl.style.color = "#2E7D32";
        stream.getTracks().forEach(track => track.stop());
      })
      .catch(function(err) {
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          textEl.innerText = "❌ マイクの使用が拒否されています (NotAllowedError)";
        } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
          textEl.innerText = "❌ マイク入力を取得できませんでした (NotReadableError)";
        } else {
          textEl.innerText = `❌ エラー: ${err.name}`;
        }
        textEl.style.color = "#E53E3E";
      });
  }

  function loadData() {
    try {
      userName = localStorage.getItem("eb_userName") || "";
      currentLevel = parseInt(localStorage.getItem("eb_level") || "1", 10);
      currentSubIndex = parseInt(localStorage.getItem("eb_subIndex") || "0", 10);
      currentIndex = parseInt(localStorage.getItem("eb_currentIndex") || "0", 10);
      streak = parseInt(localStorage.getItem("eb_streak") || "0", 10);
      total = parseInt(localStorage.getItem("eb_total") || "0", 10);
      coins = parseInt(localStorage.getItem("eb_coins") || "0", 10);
      lastDate = localStorage.getItem("eb_lastDate") || "";
      equippedHat = localStorage.getItem("eb_equippedHat") || "";
      ownedHats = JSON.parse(localStorage.getItem("eb_ownedHats") || "[]");
      unlockedBadges = JSON.parse(localStorage.getItem("eb_unlockedBadges") || "[]");
      if (userName) document.getElementById("nameInput").value = userName;
    } catch(e) { console.log("Load error", e); }
  }

  function saveData() {
    try {
      localStorage.setItem("eb_userName", userName);
      localStorage.setItem("eb_level", currentLevel.toString());
      localStorage.setItem("eb_subIndex", currentSubIndex.toString());
      localStorage.setItem("eb_currentIndex", currentIndex.toString());
      localStorage.setItem("eb_streak", streak.toString());
      localStorage.setItem("eb_total", total.toString());
      localStorage.setItem("eb_coins", coins.toString());
      localStorage.setItem("eb_lastDate", lastDate);
      localStorage.setItem("eb_equippedHat", equippedHat);
      localStorage.setItem("eb_ownedHats", JSON.stringify(ownedHats));
      localStorage.setItem("eb_unlockedBadges", JSON.stringify(unlockedBadges));
    } catch(e) { console.log("Save error", e); }
  }

  function checkStreak() {
    const today = new Date().toISOString().split('T')[0];
    if (lastDate) {
      const diff = Math.floor((new Date(today) - new Date(lastDate)) / (1000 * 60 * 60 * 24));
      if (diff > 1) streak = 0;
    }
  }

  function updateHomeDisplay() {
    document.getElementById("homeStreak").innerText = streak;
    document.getElementById("homeTotal").innerText = total;
    document.getElementById("homeCoins").innerText = coins;
  }

  function chooseInitLevel(lvl) {
    currentLevel = lvl;
    [1, 2, 3].forEach(l => document.getElementById(`initLevel_${l}`).classList.remove("selected"));
    document.getElementById(`initLevel_${lvl}`).classList.add("selected");
  }

  function saveNameAndStart() {
    const input = document.getElementById("nameInput").value.trim();
    if (!input) return alert("お名前を入力してください！");
    userName = input;
    currentIndex = 0;
    saveData();
    document.getElementById("homeArea").style.display = "none";
    document.getElementById("lessonArea").style.display = "block";
    updateCard();
  }

  function goHome() {
    updateHomeDisplay();
    document.getElementById("lessonArea").style.display = "none";
    document.getElementById("homeArea").style.display = "block";
  }

  function updateCard() {
    const subStage = curriculumData[currentLevel].subStages[currentSubIndex] || curriculumData[currentLevel].subStages[0];
    const item = subStage.items[currentIndex] || subStage.items[0];

    document.getElementById("stepProgress").innerText = `${currentIndex + 1}/${subStage.items.length}`;
    document.getElementById("enText").innerText = item.en;
    document.getElementById("jpText").innerText = item.jp;
    document.getElementById("charHat").innerText = equippedHat;

    document.getElementById("spokenBox").innerText = "👂 声を聞かせてね";
    document.getElementById("resultMsg").innerText = "";
    document.getElementById("charMsg").innerText = "ぽてワン「音の響きをよく聴いてね！」";
  }

  function speakCurrent() {
    const subStage = curriculumData[currentLevel].subStages[currentSubIndex];
    const item = subStage.items[currentIndex];
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(item.en);
    utterance.lang = "en-US";
    utterance.rate = currentSpeed;
    window.speechSynthesis.speak(utterance);
  }

  function startListen() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return alert("お使いのブラウザは音声認識に対応していません。");

    document.getElementById("spokenBox").innerText = "🎤 聞き取り中...";
    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";

    recognition.onresult = function(event) {
      const userText = event.results[0][0].transcript;
      document.getElementById("spokenBox").innerText = `🗣️ あなた: "${userText}"`;
      const item = curriculumData[currentLevel].subStages[currentSubIndex].items[currentIndex];

      if (userText.toLowerCase().replace(/[^a-z0-9]/g, "") === item.en.toLowerCase().replace(/[^a-z0-9]/g, "")) {
        document.getElementById("resultMsg").innerText = "🌟 大成功！バッチリ聞こえたよ！";
        document.getElementById("resultMsg").style.color = "#2E7D32";
        if (typeof confetti === 'function') confetti({ particleCount: 70, spread: 60 });
      } else {
        document.getElementById("resultMsg").innerText = "💪 おしい！もう一度やってみよう！";
        document.getElementById("resultMsg").style.color = "#E53E3E";
      }
    };

    recognition.onerror = function() {
      document.getElementById("spokenBox").innerText = "⚠️ 声がうまく聞き取れなかったよ。";
    };

    recognition.start();
  }

  function nextLesson() {
    const subStage = curriculumData[currentLevel].subStages[currentSubIndex];
    currentIndex++;

    if (currentIndex >= subStage.items.length) {
      currentIndex = 0;
      coins += 10;
      
      const today = new Date().toISOString().split('T')[0];
      if (lastDate !== today) {
        streak += 1;
        total += 1;
        lastDate = today;
      }

      checkBadges();
      saveData();
      alert("🎉 今日のレッスン完了！ +10コインゲット！");
      goHome();
      return;
    }

    saveData();
    updateCard();
  }

  function checkBadges() {
    if (total >= 1 && !unlockedBadges.includes("first_step")) unlockedBadges.push("first_step");
    if (streak >= 3 && !unlockedBadges.includes("streak_3")) unlockedBadges.push("streak_3");
    if (coins >= 100 && !unlockedBadges.includes("coin_100")) unlockedBadges.push("coin_100");
    saveData();
  }

  /* モーダル操作 */
  function openRecordModal() {
    document.getElementById("modalStreak").innerText = streak;
    document.getElementById("modalTotal").innerText = total;
    document.getElementById("modalCoins").innerText = coins;

    const list = document.getElementById("badgeList");
    list.innerHTML = "";
    badgeDefinitions.forEach(b => {
      const isUnlocked = unlockedBadges.includes(b.id);
      list.innerHTML += `
        <div class="badge-item" style="opacity: ${isUnlocked ? 1 : 0.4}">
          <span>${b.icon} <strong>${b.name}</strong> (${b.desc})</span>
          <span>${isUnlocked ? "✅ 獲得済" : "🔒 未解放"}</span>
        </div>`;
    });

    document.getElementById("recordModal").style.display = "flex";
  }

  function closeRecordModal() { document.getElementById("recordModal").style.display = "none"; }

  function openShopModal() {
    document.getElementById("shopCoins").innerText = coins;
    const list = document.getElementById("shopList");
    list.innerHTML = "";

    shopItems.forEach(item => {
      const isOwned = ownedHats.includes(item.id);
      const isEquipped = equippedHat === item.icon

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英会話は赤ちゃん以下 - 洋画リスニングへの道</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #FFF9F2;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
      text-align: center;
      position: relative;
      box-sizing: border-box;
    }

    h1 {
      font-size: 22px;
      color: #5A4A42;
      margin: 6px 0;
    }

    .subtitle {
      color: #8C7A6B;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .btn-icon {
      background: #F0F4F8;
      border: none;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      color: #4A5568;
      cursor: pointer;
    }

    .selection-group {
      margin: 12px 0;
      text-align: left;
    }

    .selection-label {
      font-weight: bold;
      color: #5A4A42;
      font-size: 14px;
      margin-bottom: 6px;
      display: block;
    }

    .option-grid {
      display: flex;
      gap: 8px;
    }

    .option-btn {
      flex: 1;
      background: #F7FAFC;
      border: 2px solid #E2E8F0;
      border-radius: 14px;
      padding: 10px;
      font-size: 13px;
      font-weight: bold;
      color: #4A5568;
      cursor: pointer;
      text-align: center;
    }

    .option-btn.selected {
      border-color: #FF6B6B;
      background: #FFF5F5;
      color: #C05621;
    }

    .char-area {
      background: #EBF7FF;
      border-radius: 16px;
      padding: 12px;
      margin: 12px 0;
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    .char-container {
      position: relative;
      font-size: 36px;
      min-width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .char-hat {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 22px;
      z-index: 2;
    }

    .char-msg {
      font-size: 13px;
      font-weight: bold;
      color: #2B6CB0;
      text-align: left;
    }

    .en-text {
      font-size: 25px;
      font-weight: bold;
      color: #2D3748;
      margin: 16px 0 4px;
      word-break: break-word;
    }

    .jp-text {
      font-size: 15px;
      color: #718096;
      margin-bottom: 20px;
    }

    .btn {
      width: 100%;
      padding: 13px;
      margin: 5px 0;
      border: none;
      border-radius: 30px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-sizing: border-box;
    }

    .btn-listen { background: #EBF7FF; color: #2B6CB0; }
    .btn-speak { background: #FFF0E5; color: #C05621; }
    .btn-next { background: #FF6B6B; color: white; margin-top: 10px; }
    .btn-start { background: #FF6B6B; color: white; }

    .spoken-box {
      font-size: 13px;
      color: #4A5568;
      background: #EDF2F7;
      border-radius: 12px;
      padding: 10px;
      margin-top: 8px;
      min-height: 20px;
      word-break: break-word;
    }

    .result {
      margin-top: 6px;
      font-weight: bold;
      font-size: 14px;
      min-height: 22px;
    }

    .name-input {
      width: 100%;
      padding: 10px;
      border: 2px solid #E2E8F0;
      border-radius: 12px;
      font-size: 15px;
      text-align: center;
      outline: none;
      box-sizing: border-box;
    }

    .modal {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      border-radius: 24px;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 20px;
      width: 85%;
      max-height: 90%;
      overflow-y: auto;
      text-align: center;
      box-sizing: border-box;
    }

    .mic-status {
      background: #EDF2F7;
      padding: 10px;
      border-radius: 12px;
      margin: 10px 0;
      font-size: 12px;
      color: #2D3748;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="card" id="app">

  <!-- 設定・マイクテストモーダル -->
  <div class="modal" id="recordModal">
    <div class="modal-content">
      <div style="font-size:36px;">⚙️</div>
      <h3 style="color:#5A4A42; margin:4px 0;">設定・マイクテスト</h3>
      
      <div class="mic-status">
        🎤 音声認識：
        <span id="micSupportText">確認中...</span>

        <button
          class="btn btn-listen"
          style="margin-top:8px;"
          onclick="testMicrophone()">
          🎤 マイクをテスト
        </button>
      </div>

      <button class="btn btn-next" onclick="closeRecordModal()">とじる</button>
    </div>
  </div>

  <!-- ホーム画面 -->
  <div id="homeArea">
    <div style="font-size:40px;">🎬👶</div>
    <h1>英会話は赤ちゃん以下</h1>
    <div class="subtitle">目指せ！洋画を字幕なしで聴き取る力</div>

    <div class="selection-group">
      <span class="selection-label">お名前</span>
      <input id="nameInput" class="name-input" type="text" placeholder="例: Taro" maxlength="30">
    </div>

    <!-- 相棒選択（犬か猫） -->
    <div class="selection-group">
      <span class="selection-label">相棒キャラクターを選択</span>
      <div class="option-grid">
        <div class="option-btn selected" id="charOpt_dog" onclick="selectChar('dog', '🐶', 'ぽてワン')">🐶 犬 (ぽてワン)</div>
        <div class="option-btn" id="charOpt_cat" onclick="selectChar('cat', '🐱', 'ぽてニャン')">🐱 猫 (ぽてニャン)</div>
      </div>
    </div>

    <!-- 着せ替え選択 -->
    <div class="selection-group">
      <span class="selection-label">かぶりもの（着せ替え）</span>
      <div class="option-grid">
        <div class="option-btn selected" id="hatOpt_none" onclick="selectHat('')">なし</div>
        <div class="option-btn" id="hatOpt_crown" onclick="selectHat('👑')">👑 王冠</div>
        <div class="option-btn" id="hatOpt_party" onclick="selectHat('🥳')">🥳 パーティー</div>
        <div class="option-btn" id="hatOpt_grad" onclick="selectHat('🎓')">🎓 博士帽</div>
      </div>
    </div>

    <!-- レベル選択 -->
    <div class="selection-group">
      <span class="selection-label">英語レベル</span>
      <div class="option-btn selected" id="levelOpt_1" onclick="selectLevel(1)" style="margin-bottom:6px;">🍼 レベル1：超初心者</div>
      <div class="option-btn" id="levelOpt_2" onclick="selectLevel(2)" style="margin-bottom:6px;">🐣 レベル2：日常会話</div>
      <div class="option-btn" id="levelOpt_3" onclick="selectLevel(3)">🎬 レベル3：洋画チャレンジ</div>
    </div>

    <button class="btn btn-start" onclick="startLesson()" style="margin-top:16px;">▶ レッスンスタート！</button>
  </div>

  <!-- メイン学習画面 -->
  <div id="lessonArea" style="display:none;">
    <div class="header-bar">
      <button class="btn-icon" onclick="goHome()">🏠 ホーム</button>
      <span style="color:#A0AEC0; font-size:12px; font-weight:bold;" id="stepProgress">1/5</span>
      <button class="btn-icon" onclick="openRecordModal()">⚙️ 設定</button>
    </div>

    <div class="char-area">
      <div class="char-container">
        <div class="char-hat" id="charHat"></div>
        <div id="charIcon">🐶</div>
      </div>
      <div class="char-msg" id="charMsg">ぽてワン「音の響きをよく聴いてね！」</div>
    </div>

    <div class="en-text" id="enText">Thank you.</div>
    <div class="jp-text" id="jpText">ありがとう。</div>

    <button class="btn btn-listen" id="btnListen" onclick="speakCurrent()">🔊 きく</button>
    <button class="btn btn-speak" id="btnSpeak" onclick="startListen()">🎤 マネして言う</button>

    <div class="spoken-box" id="spokenBox">👂 声を聞かせてね</div>
    <div class="result" id="resultMsg"></div>
    <button class="btn btn-next" onclick="nextLesson()">つぎへ ✨</button>
  </div>

</div>

<script>
  let userName = "";
  let selectedCharType = "dog";
  let selectedCharIcon = "🐶";
  let selectedCharName = "ぽてワン";
  let selectedHat = "";
  let currentLevel = 1;

  let currentSubIndex = 0;
  let currentIndex = 0;
  let currentSpeed = 0.5;

  const curriculumData = {
    1: { subStages: [{ items: [{ en: "Thank you.", jp: "ありがとう。" }, { en: "Good morning.", jp: "おはよう。" }, { en: "See you.", jp: "またね。" }, { en: "Hello.", jp: "こんにちは。" }, { en: "Yes.", jp: "はい。" }] }] },
    2: { subStages: [{ items: [{ en: "I'm on my way.", jp: "今向かってるよ。" }, { en: "Sounds good.", jp: "いいね！" }, { en: "No problem.", jp: "問題ないよ。" }, { en: "How are you?", jp: "元気？" }, { en: "Take care.", jp: "気をつけてね。" }] }] },
    3: { subStages: [{ items: [{ en: "Give me a break.", jp: "勘弁してよ。" }, { en: "It's up to you.", jp: "君に任せるよ。" }, { en: "Never give up.", jp: "諦めないで。" }, { en: "I got it.", jp: "分かったよ。" }, { en: "Believe in yourself.", jp: "自分を信じて。" }] }] }
  };

  window.onload = function() {
    loadData();
    checkMicSupport();
  };

  function selectChar(type, icon, name) {
    selectedCharType = type;
    selectedCharIcon = icon;
    selectedCharName = name;

    document.getElementById("charOpt_dog").classList.remove("selected");
    document.getElementById("charOpt_cat").classList.remove("selected");
    document.getElementById(`charOpt_${type}`).classList.add("selected");
  }

  function selectHat(hatIcon) {
    selectedHat = hatIcon;
    const hats = { "": "none", "👑": "crown", "🥳": "party", "🎓": "grad" };
    
    Object.values(hats).forEach(id => {
      const el = document.getElementById(`hatOpt_${id}`);
      if (el) el.classList.remove("selected");
    });
    
    const activeId = hats[hatIcon];
    if (activeId) document.getElementById(`hatOpt_${activeId}`).classList.add("selected");
  }

  function selectLevel(lvl) {
    currentLevel = lvl;
    [1, 2, 3].forEach(l => {
      const el = document.getElementById(`levelOpt_${l}`);
      if (el) el.classList.remove("selected");
    });
    document.getElementById(`levelOpt_${lvl}`).classList.add("selected");
  }

  function startLesson() {
    const input = document.getElementById("nameInput").value.trim();
    if (!input) {
      alert("お名前を入力してください！");
      return;
    }
    userName = input;
    currentIndex = 0;
    saveData();

    document.getElementById("homeArea").style.display = "none";
    document.getElementById("lessonArea").style.display = "block";
    updateCard();
  }

  function goHome() {
    document.getElementById("lessonArea").style.display = "none";
    document.getElementById("homeArea").style.display = "block";
  }

  function updateCard() {
    const subStage = curriculumData[currentLevel].subStages[currentSubIndex];
    const item = subStage.items[currentIndex];

    document.getElementById("stepProgress").innerText = `${currentIndex + 1}/${subStage.items.length}`;
    document.getElementById("enText").innerText = item.en;
    document.getElementById("jpText").innerText = item.jp;
    
    document.getElementById("charIcon").innerText = selectedCharIcon;
    document.getElementById("charHat").innerText = selectedHat;
    document.getElementById("charMsg").innerText = `${selectedCharName}「音の響きをよく聴いてね！」`;

    document.getElementById("spokenBox").innerText = "👂 声を聞かせてね";
    document.getElementById("resultMsg").innerText = "";
  }

  function speakCurrent() {
    const item = curriculumData[currentLevel].subStages[currentSubIndex].items[currentIndex];
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(item.en);
    utterance.lang = "en-US";
    utterance.rate = currentSpeed;
    window.speechSynthesis.speak(utterance);
  }

  function startListen() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return alert("お使いのブラウザは音声認識に対応していません。");

    document.getElementById("spokenBox").innerText = "🎤 聞き取り中...";
    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";

    recognition.onresult = function(event) {
      const userText = event.results[0][0].transcript;
      document.getElementById("spokenBox").innerText = `🗣️ あなた: "${userText}"`;
      const item = curriculumData[currentLevel].subStages[currentSubIndex].items[currentIndex];

      if (userText.toLowerCase().replace(/[^a-z0-9]/g, "") === item.en.toLowerCase().replace(/[^a-z0-9]/g, "")) {
        document.getElementById("resultMsg").innerText = "🌟 大成功！バッチリ聞こえたよ！";
        document.getElementById("resultMsg").style.color = "#2E7D32";
        if (typeof confetti === 'function') confetti({ particleCount: 70, spread: 60 });
      } else {
        document.getElementById("resultMsg").innerText = "💪 おしい！もう一度やってみよう！";
        document.getElementById("resultMsg").style.color = "#E53E3E";
      }
    };

    recognition.onerror = function() {
      document.getElementById("spokenBox").innerText = "⚠️ 声がうまく聞き取れなかったよ。";
    };

    recognition.start();
  }

  function nextLesson() {
    const subStage = curriculumData[currentLevel].subStages[currentSubIndex];
    currentIndex++;

    if (currentIndex >= subStage.items.length) {
      alert("🎉 レッスン完了！おめでとうございます！");
      goHome();
      return;
    }

    saveData();
    updateCard();
  }

  function loadData() {
    try {
      userName = localStorage.getItem("eb_userName") || "";
      selectedCharType = localStorage.getItem("eb_charType") || "dog";
      selectedCharIcon = localStorage.getItem("eb_charIcon") || "🐶";
      selectedCharName = localStorage.getItem("eb_charName") || "ぽてワン";
      selectedHat = localStorage.getItem("eb_hat") || "";
      currentLevel = parseInt(localStorage.getItem("eb_level") || "1", 10);

      if (userName) document.getElementById("nameInput").value = userName;
      selectChar(selectedCharType, selectedCharIcon, selectedCharName);
      selectHat(selectedHat);
      selectLevel(currentLevel);
    } catch(e) {}
  }

  function saveData() {
    try {
      localStorage.setItem("eb_userName", userName);
      localStorage.setItem("eb_charType", selectedCharType);
      localStorage.setItem("eb_charIcon", selectedCharIcon);
      localStorage.setItem("eb_charName", selectedCharName);
      localStorage.setItem("eb_hat", selectedHat);
      localStorage.setItem("eb_level", currentLevel.toString());
    } catch(e) {}
  }

  function checkMicSupport() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const textEl = document.getElementById("micSupportText");
    if (textEl) {
      if (SpeechRecognition) {
        textEl.innerText = "対応（準備OK）";
        textEl.style.color = "#2E7D32";
      } else {
        textEl.innerText = "非対応（ブラウザ未対応）";
        textEl.style.color = "#E53E3E";
      }
    }
  }

  function testMicrophone() {
    const textEl = document.getElementById("micSupportText");
    textEl.innerText = "マイク確認中...";
    textEl.style.color = "#2D3748";

    if (!window.isSecureContext) {
      textEl.innerText = "❌ 安全な接続ではありません(HTTPSが必要)";
      textEl.style.color = "#E53E3E";
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      textEl.innerText = "❌ ブラウザがマイクAPI非対応です";
      textEl.style.color = "#E53E3E";
      return;
    }

    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function(stream) {
        textEl.innerText = "✅ マイクOK！正常に取得できました！";
        textEl.style.color = "#2E7D32";
        stream.getTracks().forEach(track => track.stop());
      })
      .catch(function(err) {
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          textEl.innerText = "❌ マイクの使用が拒否されています (NotAllowedError)";
        } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
          textEl.innerText = "❌ マイク入力を取得できませんでした (NotReadableError)";
        } else {
          textEl.innerText = `❌ エラー: ${err.name}`;
        }
        textEl.style.color = "#E53E3E";
      });
  }

  function openRecordModal() { document.getElementById("recordModal").style.display = "flex"; }
  function closeRecordModal() { document.getElementById("recordModal").style.display = "none"; }
</script>

</body>
</html>

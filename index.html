  /* =========================================

  let currentLevel = 1;
  let currentSubIndex = 0;
  let currentIndex = 0;
  let streak = 0;
  let total = 0;
  let lastDate = "";

  let recognitionInstance = null;
  let listenTimeoutTimer = null;

  /* =========================================

            { en: "I don't like it.", jp: "色は好きじゃないな。" },
            { en: "I love it!", jp: "これ大好き！" },
            { en: "Me too.", jp: "私も。" }
          ]
        },
        {
          id: "1-4", title: "気持ち",
          items: [
            { en: "I don't know.", jp: "分かりません。" },
            { en: "I'm sorry.", jp: "ごめんなさい。" },
            { en: "It's fine.", jp: "大丈夫だよ。" },
            { en: "I'm fine.", jp: "元気ですよ。" },

        },
        {

    2: {

          items: [

          items: [

            { en: "I see.", jp: "なるほどね。" },

          ]
        }
      ]
    },
    3: {
      name: "レベル3",
      subStages: [
        {
          id: "3-1", title: "洋画頻出フレーズ",
          items: [
            { en: "What are you talking about?", jp: "何言ってるの？" },
            { en: "Give me a break.", jp: "勘弁してよ。" },
            { en: "It's up to you.", jp: "君に任せるよ。" },
            { en: "You gotta be kidding me.", jp: "冗談でしょ！" },
            { en: "I'll be right back.", jp: "すぐ戻るよ。" }
          ]
        },
        {
          id: "3-2", title: "感情・ネイティブ表現",
          items: [
            { en: "Never mind.", jp: "気にしないで。" },
            { en: "Don't worry about it.", jp: "心配しないで。" },
            { en: "Are you out of your mind?", jp: "正気なの？" },
            { en: "Catch you later.", jp: "また後でね。" },
            { en: "I have no idea.", jp: "さっぱり分からないや。" }
          ]
        }
      ]
    }
  };

  /* =========================================
     起動初期化
  ========================================= */
  window.onload = function() {
    loadData();
    setSpeedUI(currentSpeed);
    checkMicSupport();

    if (userName) {
      document.getElementById("nameArea").style.display = "none";
      document.getElementById("lessonArea").style.display = "block";
      updateCard();
    }
  };

  function loadData() {
    userName = localStorage.getItem("eb_userName") || "";
    currentLevel = parseInt(localStorage.getItem("eb_level") || "1", 10);
    currentSubIndex = parseInt(localStorage.getItem("eb_subIndex") || "0", 10);
    currentIndex = parseInt(localStorage.getItem("eb_currentIndex") || "0", 10);
    streak = parseInt(localStorage.getItem("eb_streak") || "0", 10);
    total = parseInt(localStorage.getItem("eb_total") || "0", 10);
    lastDate = localStorage.getItem("eb_lastDate") || "";
    currentSpeed = parseFloat(localStorage.getItem("eb_speed") || "0.5");
  }

  function saveData() {
    localStorage.setItem("eb_userName", userName);
    localStorage.setItem("eb_level", currentLevel.toString());
    localStorage.setItem("eb_subIndex", currentSubIndex.toString());
    localStorage.setItem("eb_currentIndex", currentIndex.toString());
    localStorage.setItem("eb_streak", streak.toString());
    localStorage.setItem("eb_total", total.toString());
    localStorage.setItem("eb_lastDate", lastDate);
    localStorage.setItem("eb_speed", currentSpeed.toString());
  }

  function checkMicSupport() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const target = document.getElementById("micSupportText");
    if (target) {
      if (SpeechRecognition) {
        target.innerText = "利用可能です";
        target.style.color = "#2E7D32";
      } else {
        target.innerText = "非対応（Chrome等を推奨）";
        target.style.color = "#E53E3E";
      }
    }
  }

  function chooseInitLevel(lvl) {
    currentLevel = lvl;
    [1, 2, 3].forEach(l => {
      document.getElementById(`initLevel_${l}`).classList.remove("selected");
    });
    document.getElementById(`initLevel_${lvl}`).classList.add("selected");
  }

  function saveNameAndStart() {
    const input = document.getElementById("nameInput").value.trim();
    if (!input) {
      alert("お名前を入力してください！");
      return;
    }
    userName = input;
    currentSubIndex = 0;
    currentIndex = 0;
    saveData();
    document.getElementById("nameArea").style.display = "none";
    document.getElementById("lessonArea").style.display = "block";
    updateCard();
  }

  function getCurrentSubStage() {
    const levelObj = curriculumData[currentLevel] || curriculumData[1];
    const subStages = levelObj.subStages;
    if (currentSubIndex < 0 || currentSubIndex >= subStages.length) {
      currentSubIndex = 0;
    }
    return subStages[currentSubIndex];
  }

  function updateCard() {
    const subStage = getCurrentSubStage();
    if (currentIndex < 0 || currentIndex >= subStage.items.length) {
      currentIndex = 0;
    }
    const currentItem = subStage.items[currentIndex];

    document.getElementById("stepProgress").innerText =
      `Lv.${currentLevel} (${subStage.id} ${subStage.title}) ${currentIndex + 1}/${subStage.items.length}`;
    document.getElementById("enText").innerText = currentItem.en;
    document.getElementById("jpText").innerText = currentItem.jp;
    document.getElementById("spokenBox").innerText = "👂 声を聞かせてね";
    document.getElementById("resultMsg").innerText = "";
    document.getElementById("resultMsg").style.color = "";
    document.getElementById("charIcon").innerText = "🐶";
    document.getElementById("charMsg").innerText = "ぽてワン「音の響きをよく聴いてね！」";
  }

  function speakCurrent() {
    const subStage = getCurrentSubStage();
    const currentItem = subStage.items[currentIndex];
    document.getElementById("charIcon").innerText = "🐶🎶";
    document.getElementById("charMsg").innerText = "ぽてワン「音のつながりをよく聴いてね！」";

    const utterance = new SpeechSynthesisUtterance(currentItem.en);
    utterance.lang = "en-US";
    utterance.rate = currentSpeed;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utterance);
  }

  function startListen() {
    if (isListening) return;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert("お使いのブラウザは音声認識に対応していません。Chrome等の対応ブラウザをお使いください。");
      return;
    }

    if (recognitionInstance) {
      try { recognitionInstance.abort(); } catch(e){}
    }

    isListening = true;
    const btnSpeak = document.getElementById("btnSpeak");
    if (btnSpeak) btnSpeak.disabled = true;

    document.getElementById("charIcon").innerText = "👂🐶";
    document.getElementById("charMsg").innerText = "ぽてワン「マイクを準備中…」";
    document.getElementById("spokenBox").innerText = "🎙️ 準備中...（少し待ってね）";
    document.getElementById("resultMsg").innerText = "";

    const recognition = new SpeechRecognition();
    recognitionInstance = recognition;
    recognition.lang = "en-US";
    recognition.interimResults = false;

    clearTimeout(listenTimeoutTimer);
    listenTimeoutTimer = setTimeout(() => {
      if (isListening) {
        recognition.stop();
        resetListenState("❌ タイムアウト。もう一度ボタンを押してください。");
      }
    }, 8000);

    recognition.onstart = function() {
      document.getElementById("charMsg").innerText = "ぽてワン「聞いてるよ！英語を話してね！」";
      document.getElementById("spokenBox").innerText = "🎙️ 聞き取り中... 話してください";
    };

    recognition.onresult = function(event) {
      clearTimeout(listenTimeoutTimer);
      const rawSpoken = event.results[0][0].transcript;
      document.getElementById("spokenBox").innerText = `🗣️ あなた: "${rawSpoken}"`;

      const subStage = getCurrentSubStage();
      const currentItem = subStage.items[currentIndex];
      const matchRate = calculateSimilarity(rawSpoken, currentItem.en);

      if (matchRate >= 0.75) {
        document.getElementById("charIcon").innerText = "🐶🎉🐱";
        document.getElementById("charMsg").innerText = "ぽてワン＆ぬくニャン「すごーい！そのまま通じるよ！」";
        document.getElementById("resultMsg").style.color = "#2E7D32";
        document.getElementById("resultMsg").innerText = "🎉 大成功！";
      } else if (matchRate >= 0.45) {
        document.getElementById("charIcon").innerText = "🐶✨";
        document.getElementById("charMsg").innerText = "ぽてワン「かなり近い！フレーズを意識してみて！」";
        document.getElementById("resultMsg").style.color = "#ED8936";
        document.getElementById("resultMsg").innerText = "😊 惜しい！";
      } else {
        document.getElementById("charIcon").innerText = "🐶❓";
        document.getElementById("charMsg").innerText = "ぽてワン「もう一回『きく』で音を確認してみよう！」";
        document.getElementById("resultMsg").style.color = "#E53E3E";
        document.getElementById("resultMsg").innerText = "🔄 もう一回";
      }
    };

    recognition.onerror = function(event) {
      clearTimeout(listenTimeoutTimer);
      let errorMsg = "";
      switch (event.error) {
        case 'not-allowed': errorMsg = "マイク許可が必要です。"; break;
        case 'network': errorMsg = "通信エラーです。"; break;
        case 'no-speech': errorMsg = "声が聞き取れませんでした。"; break;
        default: errorMsg = "エラーが発生しました。";
      }
      resetListenState(errorMsg);
    };

    recognition.onend = function() {
      clearTimeout(listenTimeoutTimer);
      isListening = false;
      if (btnSpeak) btnSpeak.disabled = false;
    };

    try {
      recognition.start();
    } catch (e) {
      resetListenState("起動失敗。再試行してください。");
    }
  }

  function resetListenState(msg) {
    isListening = false;
    const btnSpeak = document.getElementById("btnSpeak");
    if (btnSpeak) btnSpeak.disabled = false;
    document.getElementById("charIcon").innerText = "🐶💦";
    document.getElementById("spokenBox").innerText = "❌ 認識終了";
    document.getElementById("resultMsg").style.color = "#E53E3E";
    document.getElementById("resultMsg").innerText = msg;
  }

  function calculateSimilarity(str1, str2) {
    const cleanStr = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "");
    const s1 = cleanStr(str1);
    const s2 = cleanStr(str2);
    if (!s1 || !s2) return 0;
    if (s1 === s2) return 1.0;

    const track = Array(s2.length + 1).fill(null).map(() => Array(s1.length + 1).fill(null));
    for (let i = 0; i <= s1.length; i += 1) track[0][i] = i;
    for (let j = 0; j <= s2.length; j += 1) track[j][0] = j;

    for (let j = 1; j <= s2.length; j += 1) {
      for (let i = 1; i <= s1.length; i += 1) {
        const indicator = s1[i - 1] === s2[j - 1] ? 0 : 1;
        track[j][i] = Math.min(
          track[j][i - 1] + 1,
          track[j - 1][i] + 1,
          track[j - 1][i - 1] + indicator
        );
      }
    }
    const distance = track[s2.length][s1.length];
    const maxLength = Math.max(s1.length, s2.length);
    return (maxLength - distance) / maxLength;
  }

  function nextLesson() {
    const subStage = getCurrentSubStage();
    if (currentIndex < subStage.items.length - 1) {
      currentIndex++;
      saveData();
      updateCard();
    } else {
      alert("このステージはクリアです！次のステージへ進みます。");
      currentSubIndex++;
      currentIndex = 0;
      saveData();
      updateCard();
    }
  }

  function openRecordModal() {
    document.getElementById("modalStreak").innerText = streak;
    document.getElementById("modalTotal").innerText = total;
    checkMicSupport();
    document.getElementById("recordModal").style.display = "flex";
  }

  function closeRecordModal() {
    document.getElementById("recordModal").style.display = "none";
  }

  function setSpeed(speed) {
    currentSpeed = speed;
    setSpeedUI(speed);
    saveData();
  }

  function setSpeedUI(speed) {
    document.getElementById("speedSlow").classList.remove("active");
    document.getElementById("speedNormal").classList.remove("active");
    document.getElementById("speedFast").classList.remove("active");
    if (speed === 0.5) document.getElementById("speedSlow").classList.add("active");
    if (speed === 0.8) document.getElementById("speedNormal").classList.add("active");
    if (speed === 1.0) document.getElementById("speedFast").classList.add("active");
  }

  function selectModalLevel(lvl) {
    currentLevel = lvl;
    currentSubIndex = 0;
    currentIndex = 0;
    saveData();
    [1, 2, 3].forEach(l => {
      document.getElementById(`mLevel_${l}`).classList.remove("selected");
    });
    document.getElementById(`mLevel_${lvl}`).classList.add("selected");
  }
</script>

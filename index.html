<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語発音トレーニング</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --success-color: #2ECC71;
            --warning-color: #F39C12;
            --danger-color: #E74C3C;
            --bg-color: #F5F7FA;
            --card-bg: #FFFFFF;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary-color);
            font-size: 1.5rem;
        }

        .section {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #DDD;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 16px;
        }

        .level-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .level-btn {
            padding: 12px 8px;
            border: 2px solid #DDD;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            transition: all 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .level-btn.active {
            border-color: var(--primary-color);
            background-color: #EBF3FA;
            color: var(--primary-color);
        }

        .primary-btn {
            width: 100%;
            padding: 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .primary-btn:active {
            opacity: 0.9;
        }

        .primary-btn:disabled {
            background-color: #CCC;
            cursor: not-allowed;
        }

        .hidden {
            display: none !important;
        }

        .card {
            background: #F8F9FA;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            text-align: center;
        }

        .word-display {
            font-size: 2rem;
            font-weight: bold;
            color: #2C3E50;
            margin: 10px 0;
        }

        .status-box {
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            text-align: center;
            font-weight: bold;
        }

        .status-info { background: #E8F4F8; color: #2980B9; }
        .status-success { background: #E8F8F5; color: #27AE60; }
        .status-error { background: #FDEDEC; color: #C0392B; }

        .log-box {
            background: #1E1E1E;
            color: #00FF00;
            font-family: monospace;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            max-height: 150px;
            overflow-y: auto;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>英語発音トレーニング</h1>

    <!-- 設定・開始画面 -->
    <div id="setup-screen" class="section">
        <label for="username">お名前</label>
        <input type="text" id="username" placeholder="名前を入力してください">

        <label>難易度を選択</label>
        <div class="level-container">
            <button type="button" class="level-btn active" data-level="1">初級</button>
            <button type="button" class="level-btn" data-level="2">中級</button>
            <button type="button" class="level-btn" data-level="3">上級</button>
        </div>

        <button type="button" id="start-btn" class="primary-btn">トレーニング開始</button>
    </div>

    <!-- トレーニング画面 -->
    <div id="training-screen" class="section hidden">
        <div class="card">
            <div id="level-indicator" style="font-size:0.9rem; color:#666;">初級</div>
            <div id="target-word" class="word-display">Apple</div>
            <p id="word-translation" style="color:#666;">りんご</p>
        </div>

        <button type="button" id="mic-btn" class="primary-btn">🎤 音声認識をスタート</button>
        
        <div id="status-message" class="status-box status-info hidden"></div>

        <button type="button" id="back-btn" style="width:100%; margin-top:12px; padding:10px; background:none; border:1px solid #CCC; border-radius:8px; cursor:pointer;">
            設定に戻る
        </button>
    </div>

    <!-- システムログ -->
    <div class="log-box" id="debug-log">システム準備完了</div>
</div>

<script>
    // --- 単語データ構造 ---
    const wordData = {
        1: [
            { word: "Apple", translation: "りんご" },
            { word: "Dog", translation: "犬" },
            { word: "Cat", translation: "猫" }
        ],
        2: [
            { word: "Banana", translation: "バナナ" },
            { word: "Computer", translation: "コンピュータ" },
            { word: "Station", translation: "駅" }
        ],
        3: [
            { word: "Opportunity", translation: "機会" },
            { word: "Extraordinary", translation: "並外れた" },
            { word: "Philosophy", translation: "哲学" }
        ]
    };

    // --- アプリケーション状態 ---
    let state = {
        username: "",
        level: 1,
        currentIndex: 0,
        isListening: false
    };

    let recognition = null;

    // --- ログ出力関数 ---
    function log(msg) {
        const logBox = document.getElementById("debug-log");
        if (logBox) {
            const time = new Date().toLocaleTimeString();
            logBox.innerText = `[${time}] ${msg}\n` + logBox.innerText;
        }
        console.log(msg);
    }

    // --- エラー表示制御 ---
    function showStatus(msg, type = "info") {
        const statusBox = document.getElementById("status-message");
        if (!statusBox) return;
        statusBox.className = `status-box status-${type}`;
        statusBox.innerText = msg;
        statusBox.classList.remove("hidden");
    }

    // --- ローカルストレージ安全読み込み ---
    function safeLoadData() {
        try {
            const savedName = localStorage.getItem("pronun_app_name");
            const savedLevel = localStorage.getItem("pronun_app_level");

            if (savedName) {
                state.username = savedName;
                document.getElementById("username").value = savedName;
            }

            if (savedLevel && wordData[savedLevel]) {
                state.level = parseInt(savedLevel, 10);
                updateLevelButtons(state.level);
            }
            log("データの復元に成功しました");
        } catch (e) {
            log("ローカルストレージの初期化失敗（初回実行または無効化状態）");
        }
    }

    // --- ローカルストレージ安全保存 ---
    function safeSaveData() {
        try {
            localStorage.setItem("pronun_app_name", state.username);
            localStorage.setItem("pronun_app_level", state.level.toString());
        } catch (e) {
            log("データの保存に失敗しました");
        }
    }

    // --- レベルボタン表示更新 ---
    function updateLevelButtons(selectedLevel) {
        document.querySelectorAll(".level-btn").forEach(btn => {
            const lvl = parseInt(btn.getAttribute("data-level"), 10);
            if (lvl === selectedLevel) {
                btn.classList.add("active");
            } else {
                btn.classList.remove("active");
            }
        });
    }

    // --- イベントリスナー初期化（安全第一のバインド） ---
    function initEvents() {
        // レベル選択ボタン（イベント委譲で安全取得）
        document.querySelectorAll(".level-btn").forEach(btn => {
            btn.addEventListener("click", function(e) {
                e.preventDefault();
                const lvl = parseInt(this.getAttribute("data-level"), 10);
                if (wordData[lvl]) {
                    state.level = lvl;
                    updateLevelButtons(lvl);
                    log(`レベル ${lvl} を選択しました`);
                }
            });
        });

        // スタートボタン
        const startBtn = document.getElementById("start-btn");
        if (startBtn) {
            startBtn.addEventListener("click", function(e) {
                e.preventDefault();
                const nameInput = document.getElementById("username");
                state.username = nameInput.value.trim();

                if (!state.username) {
                    alert("お名前を入力してください");
                    return;
                }

                safeSaveData();
                startTraining();
            });
        }

        // 戻るボタン
        const backBtn = document.getElementById("back-btn");
        if (backBtn) {
            backBtn.addEventListener("click", function(e) {
                e.preventDefault();
                if (recognition && state.isListening) {
                    recognition.stop();
                }
                document.getElementById("training-screen").classList.add("hidden");
                document.getElementById("setup-screen").classList.remove("hidden");
                log("設定画面に戻りました");
            });
        }

        // 音声認識ボタン
        const micBtn = document.getElementById("mic-btn");
        if (micBtn) {
            micBtn.addEventListener("click", function(e) {
                e.preventDefault();
                toggleSpeechRecognition();
            });
        }
    }

    // --- トレーニング画面開始 ---
    function startTraining() {
        document.getElementById("setup-screen").classList.add("hidden");
        document.getElementById("training-screen").classList.remove("hidden");
        
        state.currentIndex = 0;
        updateWordDisplay();
        log("トレーニングを開始します");
    }

    // --- 単語表示更新 ---
    function updateWordDisplay() {
        const currentList = wordData[state.level];
        const item = currentList[state.currentIndex];

        document.getElementById("level-indicator").innerText = `レベル ${state.level}`;
        document.getElementById("target-word").innerText = item.word;
        document.getElementById("word-translation").innerText = item.translation;
        
        const statusBox = document.getElementById("status-message");
        if (statusBox) statusBox.classList.add("hidden");
    }

    // --- Web Speech API（音声認識）設定 ---
    function setupSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            log("❌ エラー: お使いのブラウザは音声認識機能に対応していません");
            showStatus("このブラウザは音声認識に対応していません（Chrome推奨）", "error");
            document.getElementById("mic-btn").disabled = true;
            return false;
        }

        try {
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                state.isListening = true;
                document.getElementById("mic-btn").innerText = "🛑 認識中... 話してください";
                showStatus("マイク待機中...", "info");
                log("音声認識を開始しました");
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript.trim().toLowerCase();
                const currentWord = wordData[state.level][state.currentIndex].word.toLowerCase();

                log(`認識結果: "${transcript}" (正解: "${currentWord}")`);

                if (transcript === currentWord) {
                    showStatus(`正解！ 🎉 (${transcript})`, "success");
                    setTimeout(() => {
                        nextWord();
                    }, 1500);
                } else {
                    showStatus(`おしい！ 認識された音: "${transcript}"`, "error");
                }
            };

            recognition.onerror = function(event) {
                log(`❌ 音声認識エラー: ${event.error}`);
                showStatus(`エラーが発生しました (${event.error})`, "error");
                resetMicButton();
            };

            recognition.onend = function() {
                state.isListening = false;
                resetMicButton();
                log("音声認識を終了しました");
            };

            return true;
        } catch (e) {
            log(`❌ 初期化中にエラー発生: ${e.message}`);
            return false;
        }
    }

    function resetMicButton() {
        const micBtn = document.getElementById("mic-btn");
        if (micBtn) {
            micBtn.innerText = "🎤 音声認識をスタート";
        }
    }

    function toggleSpeechRecognition() {
        if (!recognition && !setupSpeechRecognition()) {
            return;
        }

        if (state.isListening) {
            recognition.stop();
        } else {
            try {
                recognition.start();
            } catch (e) {
                log(`音声認識の開始に失敗: ${e.message}`);
            }
        }
    }

    function nextWord() {
        const currentList = wordData[state.level];
        state.currentIndex++;
        if (state.currentIndex >= currentList.length) {
            state.currentIndex = 0; // ループ
            showStatus("レベル内の単語が一巡しました！", "success");
        }
        updateWordDisplay();
    }

    // --- 初期起動処理 ---
    window.addEventListener("DOMContentLoaded", function() {
        try {
            initEvents();
            safeLoadData();
            log("アプリが正常に読み込まれました");
        } catch (e) {
            log(`❌ 初期ロードエラー: ${e.message}`);
        }
    });
</script>

</body>
</html>

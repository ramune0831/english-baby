<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイク認識テスト</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px 20px;
      background-color: #FFF9F2;
    }
    button {
      font-size: 18px;
      padding: 12px 24px;
      border-radius: 20px;
      border: none;
      background-color: #FF6B6B;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    #output {
      margin-top: 30px;
      font-size: 20px;
      font-weight: bold;
      color: #2B6CB0;
      min-height: 40px;
    }
  </style>
</head>
<body>

  <h1>🎤 音声認識テスト</h1>
  <p>下のボタンを押して「こんにちは」と話してください</p>
  
  <button onclick="startTest()">🎤 マイクテスト開始</button>
  
  <div id="output">（ここに認識された文字が出ます）</div>

  <script>
    function startTest() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("このブラウザは音声認識に対応していません");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = "ja-JP"; // まずは日本語でマイクテスト

      document.getElementById("output").innerText = "👂 聞き取り中...";

      recognition.onresult = function(event) {
        const spoken = event.results[0][0].transcript;
        document.getElementById("output").innerText = "🎉 認識成功: " + spoken;
      };

      recognition.onerror = function(e) {
        document.getElementById("output").innerText = "❌ エラー: " + e.error;
      };

      recognition.start();
    }
  </script>
</body>
</html>
